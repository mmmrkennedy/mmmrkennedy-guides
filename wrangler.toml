# Wrangler config — the SOURCE OF TRUTH for this project's bindings, plus local
# development (`wrangler pages dev`) and the D1 CLI (`wrangler d1 migrations
# apply`, `wrangler d1 execute`).
#
# Because `pages_build_output_dir` is set, Pages reads its configuration from
# here and the dashboard's bindings UI goes read-only ("Bindings for this
# project are being managed through wrangler.toml"). Add or change a binding by
# editing this file and deploying — there is no dashboard alternative.
#
# Bindings declared at the top level apply to BOTH production and preview
# deployments. An [env.preview] section is only needed to give preview something
# different, and overriding one binding there means re-declaring all of them.

name = "mmmrkennedyzombiesguides"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# D1 database holding the `flags` (feedback) and `views` tables.
[[d1_databases]]
binding = "DB"
database_name = "guides-feedback"
database_id = "48528733-1919-4fb7-9954-abf886bae318"
migrations_dir = "migrations"

# Guide screenshots. Served by functions/games/[[path]].js so they no longer
# ship inside the deployment. Two prefixes: `img/` holds one full-size file per
# image in src/games, `variants/<width>/` the downscaled copies picked by ?w=.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "mmmrkennedy-images"
