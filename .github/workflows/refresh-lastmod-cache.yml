name: Refresh lastmod cache

on:
  # Primary refresh now runs locally in the pre-commit hook (.githooks/pre-commit),
  # so the cache is correct in the same commit — no GitHub round-trip, no bot commit.
  # Kept as a manual backstop: run it from the Actions tab if the cache ever drifts
  # (e.g. a commit made with --no-verify, or before `bun install` set up the hook).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh lastmod-cache.json
        run: node build_scripts/refresh-lastmod-cache.cjs

      - name: Commit updated cache if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_scripts/lastmod-cache.json
          if git diff --cached --quiet; then
            echo "No changes to lastmod-cache.json — skipping commit."
          else
            git commit -m "chore: refresh lastmod-cache.json [skip ci]"
            git push
          fi