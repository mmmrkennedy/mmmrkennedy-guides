name: Refresh lastmod cache

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh lastmod-cache.json
        run: node build_scripts/refresh-lastmod-cache.cjs

      - name: Commit updated cache if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_scripts/lastmod-cache.json
          if git diff --cached --quiet; then
            echo "No changes to lastmod-cache.json — skipping commit."
          else
            git commit -m "chore: refresh lastmod-cache.json [skip ci]"
            git push
          fi