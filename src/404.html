<!--
    Deliberately self-contained: no bundle, no webfont, no image, no script.

    Cloudflare Pages serves this file for anything it cannot find. Without it,
    Pages answers unknown paths with index.html and a 200 — and because
    src/_headers matches on path, a miss on /js/<hash>.js got stamped
    `public, max-age=2592000`, so an edge node that briefly lacked a
    newly-deployed asset cached that HTML under the asset's URL for 30 days.
    Every visitor routed there then got text/html for a <script>, which
    X-Content-Type-Options: nosniff blocks, and the site's JS was dead until
    someone purged the cache by hand. This file makes that a 404 instead.

    It must therefore never reference a hashed asset: the one moment it gets
    served is the moment those assets may be unreachable.
-->
