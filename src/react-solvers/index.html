<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="/css/styles.css?v=1767549486337" />
        <link rel="stylesheet" type="text/css" href="/css/Solvers.css?v=1767549486337" />
        <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
        <base target="_blank" />
        <title>All Solvers - Dev</title>

        <!-- Vite's entry HTML ships to dist/react-solvers/index.html and is live at
             https://mmmrkennedy.com/react-solvers/, so it is crawlable even though
             nothing links to it. It is a bench for the solver components, not a page
             for readers: no canonical, no description, and a <base target="_blank">
             that would make every indexed link behave oddly. Keep it out of the index.
             The hashed JS under assets/ is what the real guide pages load and is
             unaffected by this tag. -->
        <meta name="robots" content="noindex, nofollow" />

        <!-- Dev preview only. On the real pages the guide layout gives the
             solvers their width; this page has no layout, so cap the column
             and centre it here rather than in Solvers.css.

             Centring is left to .solver-only-page's margin-inline:auto (the
             same rule the real solver pages use). Don't reach for
             align-items:center: in a column flex container that sizes each
             solver to its own content instead of to the viewport, so a wide
             board like the reactor grid drags the whole page into horizontal
             scroll on a phone. Stretch keeps the width coming from the
             viewport downwards. -->
        <style>
            #root > div {
                display: flex;
                flex-direction: column;
                gap: var(--space-lg, 2rem);
                padding-inline: var(--space-md, 1rem);
            }

            #root .solver-container {
                max-width: min(60rem, 100%);
            }
        </style>
    </head>
    <body>
        <div>
            <h1 style="text-align: center">All Solvers - Development Preview</h1>

            <!-- Stands in for the guide's own key dropdown, so the morse solver's
                 adopt-the-select path can be tested here too. -->
            <p style="text-align: center">
                <label for="venom-y-key-selector"><b>Select your Key:</b></label>
                <select id="venom-y-key-selector" name="venom-y-key">
                    <option value="default" disabled selected>Select a Key</option>
                    <option value="archer">ARCHER</option>
                    <option value="cross">CROSS</option>
                </select>
            </p>

            <div id="root" class="solver-only-page"></div>
        </div>

        <!-- Vite will inject the script here during development -->
        <script type="module" src="src/main.tsx?v=1767549486337"></script>
    </body>
</html>
